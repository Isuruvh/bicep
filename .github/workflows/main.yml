on: [push]
name: Azure Resource Manager
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - uses: actions/checkout@main

        # Log into Azure
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

        # Deploy Bicep file
      - name: deploy
        uses: azure/arm-deploy@v1
        with:
          subscriptionId: 7213a958-80d0-4a44-97a0-d0b8c0ed65ce
          resourceGroupName: Bicep
          template: ./main.bicep
          parameters: storagePrefix=stg
          failOnStdErr: false
